<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="5sHuaUOxA4rPBDZDm7EFed4KCA39_pjLl4SSTQphADo" />
  <meta name="description" content="A free, searchable digital archive of H.P. Lovecraft's fiction, essays, poetry, and personal correspondence." />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H.P. Lovecraft — Digital Archive</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --sidebar-bg: #ede5d6;
      --surface: #faf6ee;
      --text: #26211b;
      --muted: #6e6356;
      --border: #d8ccb8;
      --accent: #6b3a2e;
      --hover: #e4d9c5;
      --active: #dcd0ba;
    }

    [data-theme="dark"] {
      --bg: #171614;
      --sidebar-bg: #1f1d1a;
      --surface: #25221e;
      --text: #ddd6ca;
      --muted: #968c7e;
      --border: #332f29;
      --accent: #c88b76;
      --hover: #2a2722;
      --active: #353029;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 330px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .brand h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .theme-btn:hover { color: var(--text); border-color: var(--muted); }

    .search-box {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
    }

    .search-box:focus { border-color: var(--accent); }

    .search-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search-options label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 0.15rem 0.35rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.65rem;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: capitalize;
    }

    .pill:hover { background: var(--hover); color: var(--text); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .doc-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.35rem 0;
    }

    .doc-item {
      padding: 0.55rem 1rem;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .doc-item:hover { background: var(--hover); }
    .doc-item.active { background: var(--active); border-left-color: var(--accent); }

    .doc-title {
      font-size: 0.88rem;
      line-height: 1.3;
      font-weight: 500;
    }

    .doc-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 0.15rem;
      text-transform: capitalize;
    }

    .doc-snippet {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Main reader */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 2rem 5rem;
      position: relative;
    }

    .mobile-bar {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .menu-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 0.25rem 0.6rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    article, .welcome {
      max-width: 68ch;
      margin: 0 auto;
    }

    .welcome h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .welcome p {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin: 1.5rem 0;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
    }

    .stat-card .num {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-card .lbl {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: capitalize;
      margin-top: 0.15rem;
    }

    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .action-btn:hover { opacity: 0.9; }

    .article-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }

    .article-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
    }

    .article-header h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.25;
      margin: 0.35rem 0 0.6rem;
    }

    .article-sub {
      font-size: 0.83rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .article-sub a, .welcome a {
      color: var(--accent);
      text-decoration: none;
    }

    .article-sub a:hover, .welcome a:hover { text-decoration: underline; }

    .article-body {
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .article-body p {
      margin-bottom: 1.25rem;
      white-space: pre-line;
    }

    .article-body.poetry p {
      margin-bottom: 1.5rem;
      padding-left: 1rem;
    }

    .article-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 0.85rem;
      font-size: 0.84rem;
      cursor: pointer;
      max-width: 48%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 1rem;
    }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      .mobile-bar { display: flex; }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: 85vw;
        max-width: 340px;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.25);
      }
      aside.open { transform: translateX(0); }
      main { padding: 1.5rem 1.25rem 4rem; }
      .article-header h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="mobile-bar">
    <button class="menu-btn" id="menuBtn">☰ Library</button>
    <span style="font-family: Georgia, serif; font-weight: 600;">H.P. Lovecraft Archive</span>
  </div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <h1 id="homeBtn">H.P. Lovecraft Archive</h1>
        <button class="theme-btn" id="themeBtn">Dark</button>
      </div>
      <input type="search" id="search" class="search-box" placeholder="Search titles..." autocomplete="off" />
      <div class="search-options">
        <label><input type="checkbox" id="fullText" /> Search full text</label>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <select id="sortBy" class="sort-select" aria-label="Sort works">
            <option value="title">A–Z</option>
            <option value="date-asc">Oldest</option>
            <option value="date-desc">Newest</option>
          </select>
          <span id="count">Loading…</span>
        </div>
      </div>
      <div class="pills" id="pills"></div>
    </div>
    <ul class="doc-list" id="docList"></ul>
  </aside>

  <main id="reader">
    <div class="welcome" id="content">
      <p class="status">Loading archive…</p>
    </div>
  </main>

  <script>
    const DATA_URL = "./data/lovecraft.jsonl";
    const CATEGORIES = ["all", "fiction", "essays", "poetry", "letters"];

    let docs = [];
    let filtered = [];
    let activeCat = "all";
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    const sidebar = $("sidebar");
    const docList = $("docList");
    const content = $("content");
    const reader = $("reader");
    const searchInput = $("search");
    const fullTextToggle = $("fullText");
    const sortSelect = $("sortBy");
    const countEl = $("count");
    const pillsEl = $("pills");

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function wordCount(text) {
      return text.trim().split(/\s+/).length;
    }

    function sourceHost(url) {
      try {
        const host = new URL(url).hostname.replace(/^www\./, "");
        if (host.includes("github.com")) return "LetterCraft (GitHub)";
        return host;
      } catch {
        return "Source";
      }
    }

    function setActiveItem(id) {
      docList.querySelector(".doc-item.active")?.classList.remove("active");
      if (id) {
        docList.querySelector(`.doc-item[data-id="${CSS.escape(id)}"]`)?.classList.add("active");
      }
    }

    function initPills() {
      pillsEl.innerHTML = CATEGORIES.map((cat) =>
        `<button class="pill ${cat === activeCat ? "active" : ""}" data-cat="${cat}">${cat}</button>`
      ).join("");
    }

    function makeSnippet(text, query) {
      const idx = text.toLowerCase().indexOf(query);
      if (idx === -1) return "";
      const start = Math.max(0, idx - 45);
      const end = Math.min(text.length, idx + query.length + 75);
      return (start > 0 ? "…" : "") + text.slice(start, end).replace(/\s+/g, " ") + (end < text.length ? "…" : "");
    }

    function compareDocs(a, b, sortBy) {
      if (sortBy === "date-asc" || sortBy === "date-desc") {
        if (a.date && b.date) {
          const cmp = a.date.localeCompare(b.date);
          if (cmp !== 0) return sortBy === "date-asc" ? cmp : -cmp;
        } else if (a.date || b.date) {
          return a.date ? -1 : 1; // undated always at the end
        }
      }
      return a.title.localeCompare(b.title);
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const useFullText = fullTextToggle.checked;
      const sortBy = sortSelect.value;

      filtered = docs.filter((d) => {
        if (activeCat !== "all" && d.category !== activeCat) return false;
        if (!q) return true;
        if (d._titleLower.includes(q)) return true;
        return useFullText && d._textLower.includes(q);
      });

      filtered.sort((a, b) => {
        if (q) {
          const aTitle = a._titleLower.includes(q) ? 0 : 1;
          const bTitle = b._titleLower.includes(q) ? 0 : 1;
          if (aTitle !== bTitle) return aTitle - bTitle;
        }
        return compareDocs(a, b, sortBy);
      });

      countEl.textContent = `${filtered.length} work${filtered.length === 1 ? "" : "s"}`;

      docList.innerHTML = filtered.map((d) => {
        const snippet = q && useFullText && !d._titleLower.includes(q)
          ? `<div class="doc-snippet">${escapeHtml(makeSnippet(d.text, q))}</div>`
          : "";
        return `
          <li class="doc-item ${d.id === activeId ? "active" : ""}" data-id="${escapeHtml(d.id)}">
            <div class="doc-title">${escapeHtml(d.title)}</div>
            <div class="doc-meta">${d.category}${d.date ? ` · ${escapeHtml(d.date)}` : ""} · ${d._words.toLocaleString()} words</div>${snippet}
          </li>
        `;
      }).join("");
    }

    function renderWelcome() {
      activeId = null;
      setActiveItem(null);
      history.replaceState(null, "", location.pathname);
      document.title = "H.P. Lovecraft — Digital Archive";

      const counts = Object.fromEntries(CATEGORIES.slice(1).map((c) => [c, 0]));
      let totalWords = 0;
      for (const d of docs) {
        if (counts[d.category] !== undefined) counts[d.category]++;
        totalWords += d._words;
      }

      content.className = "welcome";
      content.innerHTML = `
        <h2>H.P. Lovecraft Archive</h2>
        <p>
          A clean, searchable collection of ${docs.length} works (${totalWords.toLocaleString()} words)
          spanning fiction, essays, poetry, and personal correspondence. Select any work from the
          sidebar to start reading.
        </p>
        <div class="stats-grid">
          ${Object.entries(counts).map(([k, v]) => `
            <div class="stat-card"><div class="num">${v}</div><div class="lbl">${k}</div></div>
          `).join("")}
        </div>
        <p>
          <button class="action-btn" id="randomBtn">Read a random work</button>
        </p>
        <p style="font-size: 0.88rem; margin-top: 2rem;">
          Compiled from <a href="https://hplovecraft.com" target="_blank" rel="noopener">hplovecraft.com</a>,
          <a href="https://en.wikisource.org/wiki/Author:Howard_Phillips_Lovecraft" target="_blank" rel="noopener">Wikisource</a>,
          and <a href="https://github.com/punchmonster/Lovecraft-Letters" target="_blank" rel="noopener">The LetterCraft Project</a>.
          Source &amp; raw data on <a href="https://github.com/Lla-bas/lovecraft-digital-archive" target="_blank" rel="noopener">GitHub</a>.
        </p>
      `;
      $("randomBtn").addEventListener("click", () => {
        const pick = docs[Math.floor(Math.random() * docs.length)];
        if (pick) openDoc(pick.id);
      });
    }

    function openDoc(id, updateHash = true) {
      const doc = docs.find((d) => d.id === id);
      if (!doc) return renderWelcome();

      activeId = doc.id;
      if (updateHash) location.hash = encodeURIComponent(doc.id);
      document.title = `${doc.title} — H.P. Lovecraft Archive`;

      const idx = filtered.findIndex((d) => d.id === doc.id);
      const prev = idx > 0 ? filtered[idx - 1] : null;
      const next = idx >= 0 && idx < filtered.length - 1 ? filtered[idx + 1] : null;

      const paragraphs = doc.text
        .split(/\n{2,}/)
        .map((p) => `<p>${escapeHtml(p)}</p>`)
        .join("");

      content.className = "";
      content.innerHTML = `
        <article>
          <header class="article-header">
            <div class="article-cat">${escapeHtml(doc.category)}</div>
            <h2>${escapeHtml(doc.title)}</h2>
            <div class="article-sub">
              ${doc.date ? `<span>${escapeHtml(doc.date)}</span>` : ""}
              <span>${doc._words.toLocaleString()} words</span>
              <span>Source: <a href="${escapeHtml(doc.source)}" target="_blank" rel="noopener">${escapeHtml(sourceHost(doc.source))}</a></span>
            </div>
          </header>
          <div class="article-body ${doc.category === "poetry" ? "poetry" : ""}">
            ${paragraphs}
          </div>
          <nav class="article-nav">
            <button class="nav-btn" id="prevBtn" ${prev ? "" : "disabled"}>← ${prev ? escapeHtml(prev.title) : "Start"}</button>
            <button class="nav-btn" id="nextBtn" ${next ? "" : "disabled"}>${next ? escapeHtml(next.title) : "End"} →</button>
          </nav>
        </article>
      `;

      if (prev) $("prevBtn").addEventListener("click", () => openDoc(prev.id));
      if (next) $("nextBtn").addEventListener("click", () => openDoc(next.id));

      reader.scrollTop = 0;
      setActiveItem(activeId);
    }

    // Theme toggle (defaults to warm paper)
    const themeBtn = $("themeBtn");
    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeBtn.textContent = dark ? "Paper" : "Dark";
      localStorage.setItem("theme", dark ? "dark" : "light");
    }
    setTheme(localStorage.getItem("theme") === "dark");
    themeBtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme !== "dark"));

    // Mobile drawer
    $("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));
    reader.addEventListener("click", () => sidebar.classList.remove("open"));
    $("homeBtn").addEventListener("click", () => {
      renderWelcome();
      sidebar.classList.remove("open");
    });

    // Debounced search
    let timer;
    searchInput.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(applyFilter, 150);
    });
    fullTextToggle.addEventListener("change", () => {
      searchInput.placeholder = fullTextToggle.checked ? "Search titles & text..." : "Search titles...";
      applyFilter();
    });
    sortSelect.addEventListener("change", applyFilter);

    window.addEventListener("hashchange", () => {
      const id = decodeURIComponent(location.hash.slice(1));
      if (id && id !== activeId) openDoc(id, false);
    });

    // Delegated sidebar listeners
    pillsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn || btn.dataset.cat === activeCat) return;
      activeCat = btn.dataset.cat;
      pillsEl.querySelector(".pill.active")?.classList.remove("active");
      btn.classList.add("active");
      applyFilter();
    });

    docList.addEventListener("click", (e) => {
      const li = e.target.closest(".doc-item");
      if (!li) return;
      openDoc(li.dataset.id);
      sidebar.classList.remove("open");
    });

    // Boot
    async function init() {
      initPills();
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.text();
        docs = raw
          .split("\n")
          .filter(Boolean)
          .map((line) => {
            const d = JSON.parse(line);
            d._titleLower = d.title.toLowerCase();
            d._textLower = d.text.toLowerCase();
            d._words = wordCount(d.text);
            return d;
          })
          .sort((a, b) => a.title.localeCompare(b.title));

        applyFilter();
        const initialId = decodeURIComponent(location.hash.slice(1));
        if (initialId) openDoc(initialId, false);
        else renderWelcome();
      } catch (err) {
        content.innerHTML = `<p class="status">Failed to load <code>${DATA_URL}</code> (${escapeHtml(err.message)}). If testing locally, serve the folder with <code>python -m http.server</code>.</p>`;
      }
    }

    init();
  </script>
</body>
</html>
